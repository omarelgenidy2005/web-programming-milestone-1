<div class="profile-container">
  <h1>Your Profile</h1>
  <p class="subtitle">Here are your saved account details</p>

  <div class="profile-card">
    <h2>{{ user.fullname }}</h2>
    <p class="username">@{{ user.username }}</p>

    <p><strong>Email:</strong> {{ user.email }}</p>
    <p><strong>Credit Card:</strong> **** **** **** {{ last4 }}</p>
    <p><strong>Preferences:</strong> {{ user.prefs }}</p>
  </div>
</div>
