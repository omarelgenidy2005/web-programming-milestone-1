<div class="signup-container">

  <h1>Create Your Account</h1>
  <p class="subtitle">Sign up to access the University Accounting System</p>

  <form (submit)="handleSignup($event)">

    <label>Username</label>
    <input type="text" name="username" required />

    <label>Email</label>
    <input type="email" name="email" required />

    <label>Role</label>
    <select name="role" required>
      <option value="student">Student</option>
      <option value="staff">Staff</option>
      <option value="accounting">Accounting Personnel</option>
      <option value="admin">Admin</option>
    </select>

    <label>Password</label>
    <input type="password" name="password" required />

    <label>Credit Card Number</label>
    <input type="text" name="creditcard" maxlength="16" required />

    <button type="submit" class="btn">Create Account</button>

  </form>

</div>
