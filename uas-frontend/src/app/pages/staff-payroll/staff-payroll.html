<div class="payroll-container">

  <h1>Staff Payroll</h1>
  <p class="subtitle">Payroll History</p>

  <div class="payroll-list">
    <div *ngFor="let payroll of payrolls" class="payroll-card">
      <h3>{{ payroll.payment_date | date }}</h3>
      <table>
        <tr>
          <th>Staff Name</th>
          <td>{{ payroll.staff_name }}</td>
        </tr>
        <tr>
          <th>Position</th>
          <td>{{ payroll.position }}</td>
        </tr>
        <tr>
          <th>Salary</th>
          <td>{{ payroll.salary }} EGP</td>
        </tr>
        <tr>
          <th>Status</th>
          <td>{{ payroll.status }}</td>
        </tr>
      </table>
      <button class="btn" (click)="downloadPayroll(payroll)">Download JSON</button>
    </div>
    <div *ngIf="payrolls.length === 0">
      <p>No payroll records found.</p>
    </div>
  </div>

</div>
