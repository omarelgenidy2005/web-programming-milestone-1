<div class="signup-container glass-panel fade-in">
  <h1>Create Account</h1>
  <p class="subtitle">Join the university platform today</p>

  <form (submit)="handleSignup($event)">
    <label>Username</label>
    <input type="text" name="username" required placeholder="johndoe" />

    <label>Email Address</label>
    <input type="email" name="email" required placeholder="john@university.edu" />

    <label>Role</label>
    <select name="role" required
      style="width: 100%; padding: 12px; border-radius: 12px; background: var(--input-bg); color: white; border: var(--glass-border); margin-top: 6px;">
      <option value="student">Student</option>
      <option value="staff">Staff</option>
      <option value="accounting">Accounting Personnel</option>
      <option value="admin">Admin</option>
    </select>

    <label>Password</label>
    <input type="password" name="password" required placeholder="••••••••" />

    <button type="submit" class="btn">Create Account</button>
  </form>
</div>
