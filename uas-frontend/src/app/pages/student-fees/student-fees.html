<div class="fees-container">
  <h1>Student Fees</h1>
  <p class="subtitle">Here you can find your invoices and payment details.</p>

  <table>
    <thead>
      <tr>
        <th>Invoice ID</th>
        <th>Description</th>
        <th>Amount (EGP)</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let invoice of invoices">
        <td>{{ invoice.id }}</td>
        <td>{{ invoice.description }}</td>
        <td>{{ invoice.amount }}</td>
        <td>
          <span [class.paid]="invoice.status === 'Paid'" [class.pending]="invoice.status === 'Pending'">
            {{ invoice.status }}
          </span>
        </td>
        <td>
          <button class="btn">View</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
