<div class="payroll-container fade-in">

  <h1>Staff Payroll</h1>
  <p class="subtitle">Payroll History</p>

  <div class="create-form" *ngIf="canCreatePayroll">
    <h3>Add Payroll Entry</h3>
    <form (submit)="addPayroll()">
      <label>Staff Name</label>
      <input type="text" [(ngModel)]="newPayroll.staff_name" name="staff_name" required />

      <label>Salary (EGP)</label>
      <input type="number" [(ngModel)]="newPayroll.salary" name="salary" required />

      <label>Allowances (EGP)</label>
      <input type="number" [(ngModel)]="newPayroll.allowances" name="allowances" />

      <label>Deductions (EGP)</label>
      <input type="number" [(ngModel)]="newPayroll.deductions" name="deductions" />

      <button type="submit" class="btn">Add Entry</button>
    </form>
  </div>

  <div class="payroll-list">
    <div *ngFor="let payroll of payrolls" class="payroll-card">
      <h3>{{ payroll.created_at | date }}</h3>
      <table>
        <tr>
          <th>Staff Name</th>
          <td>{{ payroll.staff_name }}</td>
        </tr>
        <tr>
          <th>Salary</th>
          <td>{{ payroll.salary }} EGP</td>
        </tr>
        <tr>
          <th>Allowances</th>
          <td class="income">+ {{ payroll.allowances || 0 }} EGP</td>
        </tr>
        <tr>
          <th>Deductions</th>
          <td class="expense">- {{ payroll.deductions || 0 }} EGP</td>
        </tr>
      </table>
      <button class="btn" (click)="downloadPayroll(payroll)">Download Report (JSON)</button>
    </div>
    <div *ngIf="payrolls.length === 0">
      <p>No payroll records found.</p>
    </div>
  </div>

</div>
