<div class="signup-container">

  <h1>Create Your Account</h1>
  <p class="subtitle">Sign up to access the University Accounting System</p>

  <form (submit)="handleSignup($event)">

    <label>Username</label>
    <input type="text" name="username" required />

    <label>Full Name</label>
    <input type="text" name="fullname" required />

    <label>Email</label>
    <input type="email" name="email" required />

    <label>Password</label>
    <input type="password" name="password" required />

    <label>Profile Picture</label>
    <input type="file" name="picture" accept="image/*" />

    <label>Credit Card Number</label>
    <input type="text" name="creditcard" maxlength="16" required />

    <label>Preferences</label>
    <div class="prefs">
      <label><input type="checkbox" name="prefs" value="email-updates" /> Email Updates</label>
      <label><input type="checkbox" name="prefs" value="sms-alerts" /> SMS Alerts</label>
      <label><input type="checkbox" name="prefs" value="dashboard-tips" /> Dashboard Tips</label>
    </div>

    <button type="submit" class="btn">Create Account</button>

  </form>

</div>
